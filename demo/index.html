<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>nobait P5 — animation demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #0f0f0f;
        color: #eee;
        margin: 0;
        padding: 24px;
      }
      h1 {
        font-size: 18px;
      }
      .controls {
        display: flex;
        gap: 12px;
        margin-bottom: 20px;
        flex-wrap: wrap;
      }
      button {
        background: #272727;
        color: #fff;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 14px;
      }
      button:hover {
        background: #3a3a3a;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
        gap: 16px;
      }
      .card {
        background: #1c1c1c;
        border-radius: 10px;
        overflow: hidden;
      }
      .thumb {
        position: relative;
        height: 135px;
        background: #333;
      }
      .thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .meta {
        padding: 10px 12px;
      }
      .title {
        font-weight: 600;
        font-size: 14px;
        line-height: 1.35;
        min-height: 2.7em;
      }
      .stamp {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        font-size: 13px;
        margin-top: 6px;
        border: 2px solid currentColor;
        will-change: transform, opacity;
      }
      .stamp.legitimate {
        color: #2ecc71;
      }
      .stamp.exaggerated {
        color: #f1c40f;
      }
      .stamp.misleading {
        color: #e74c3c;
      }
      .stamp.clickbait {
        color: #e67e22;
      }
      .stamp.fake {
        color: #8e2020;
      }
      .stamp.unsure {
        color: #999;
      }
    </style>
  </head>
  <body>
    <h1>nobait P5 — decode / pixel dissolve / stamp pop</h1>
    <div class="controls">
      <button onclick="run(false, 600)">Cold inference (600ms)</button>
      <button onclick="run(true, 40)">Cache hit (40ms)</button>
      <button onclick="run(false, 5, true)">Slow (5ms, super-fast)</button>
      <button onclick="toggleReduced()">Toggle reduced motion</button>
    </div>
    <div class="grid" id="grid"></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
