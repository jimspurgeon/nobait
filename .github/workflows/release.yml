name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Full quality gates — a tag must be releasable, not just tagged.
  gates:
    name: Lint + Typecheck + Test + Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Secret scanning preflight
        run: |
          set -euo pipefail
          PATTERNS='AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{36,}|AKIA[0-9A-Z]{16}'
          FOUND=$(git grep -nEI "$PATTERNS" -- \
            ':!package-lock.json' \
            ':!*.svg' \
            || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Potential secrets detected in tracked files:"
            echo "$FOUND"
            exit 1
          fi

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  package:
    name: Package & Publish
    runs-on: ubuntu-latest
    needs: [gates]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build:firefox

      - name: Package artifacts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          cd dist/firefox
          # The .xpi is byte-identical to the .zip — Firefox accepts a plain
          # zip with manifest.json at the archive root, which is exactly the
          # dist/firefox layout. Rename for the AMO-friendly extension.
          zip -r "../nobait-${VERSION}-firefox.zip" .
          cp "../nobait-${VERSION}-firefox.zip" "../nobait-${VERSION}-firefox.xpi"
          cd ../..
          ls -la dist/nobait-${VERSION}-firefox.*

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # Grab the section for this version (up to the next "## [" heading).
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { in_section=1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No CHANGELOG.md section found for version $VERSION — using placeholder."
            echo "See CHANGELOG.md for details." > RELEASE_NOTES.md
          fi
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "nobait ${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md \
            "dist/nobait-${VERSION}-firefox.zip" \
            "dist/nobait-${VERSION}-firefox.xpi"
