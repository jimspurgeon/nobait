name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for leaked API keys and tokens
        # Cheap guard against committing credentials. Extends easily:
        # add patterns to the grep alternation below.
        run: |
          set -euo pipefail
          # Patterns: Google API keys (Gemini), OpenAI-style sk- keys,
          # GitHub tokens, AWS access key IDs.
          PATTERNS='AIza[0-9A-Za-z_-]{35}|sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{36,}|AKIA[0-9A-Z]{16}'
          # Exclude lockfile hashes (base64 integrity strings can collide
          # with loose prefixes) and vendored/generated files.
          FOUND=$(git grep -nEI "$PATTERNS" -- \
            ':!package-lock.json' \
            ':!*.svg' \
            || true)
          if [ -n "$FOUND" ]; then
            echo "::error::Potential secrets detected in tracked files:"
            echo "$FOUND"
            exit 1
          fi
          echo "No known secret patterns found."

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build (Firefox)
    runs-on: ubuntu-latest
    needs: [secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:firefox
      - uses: actions/upload-artifact@v4
        with:
          name: nobait-firefox-${{ github.sha }}
          path: dist/firefox/
          if-no-files-found: error
